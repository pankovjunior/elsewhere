<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f7f3"><title>Elsewhere — Saint Petersburg</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;background:#f8f7f3;color:#1e2925;font:15px/1.5 system-ui,-apple-system,sans-serif}header{padding:22px 20px 14px;max-width:900px;margin:auto}.brand{font-family:Georgia,serif;font-size:34px;letter-spacing:-2px;font-weight:bold}.tag{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#78827c}.hero{padding:14px 20px 20px;max-width:900px;margin:auto}h1{font-family:Georgia,serif;font-size:clamp(32px,8vw,58px);font-weight:normal;line-height:1.05;margin:10px 0}p{margin:6px 0 14px}.sub{color:#66716b}#map{height:360px;width:100%;z-index:1}.mapwrap{max-width:900px;margin:auto;overflow:hidden;border-radius:18px;border:1px solid #e4e5de}.content{max-width:900px;margin:auto;padding:20px}.filters{display:flex;gap:8px;overflow-x:auto;padding:3px 0 18px}.filters button{white-space:nowrap;border:1px solid #cfd5ce;border-radius:24px;padding:9px 16px;background:white;color:#1e2925;font:inherit}.filters button.active{background:#1d392e;color:white;border-color:#1d392e}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:15px}.card{background:#fff;border:1px solid #e4e6e0;border-radius:17px;overflow:hidden;scroll-margin-top:12px}.photo{height:170px;background:#e5e9e4;object-fit:cover;width:100%;display:block}.body{padding:17px}.type{font-size:11px;color:#738078;text-transform:uppercase;letter-spacing:1.2px}h2{font-family:Georgia,serif;font-weight:normal;font-size:25px;margin:5px 0}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.btn{background:#1d392e;color:white;text-decoration:none;padding:10px 13px;border-radius:10px;font-size:13px}.btn.alt{background:#eef1ec;color:#1d392e}.leaflet-popup-content-wrapper{border-radius:12px}.leaflet-popup-content{font:14px system-ui}.leaflet-popup-content button{border:0;background:#1d392e;color:white;padding:8px 12px;border-radius:8px;margin-top:8px}footer{padding:25px 20px;color:#7a837d;text-align:center;font-size:12px}@media(max-width:650px){#map{height:47vh;min-height:300px}.mapwrap{border-radius:0;border-left:0;border-right:0}.content{padding:17px}.grid{grid-template-columns:1fr}.photo{height:200px}}header{display:flex;align-items:center;justify-content:space-between;padding-top:18px;padding-bottom:18px;gap:12px;flex-wrap:wrap}.homeLink{white-space:nowrap}.brand{font-size:31px}.homeLink{font-size:13px;color:#34483d;text-decoration:none;border:1px solid #d7dfd6;border-radius:30px;padding:8px 12px}.hero{padding-top:38px;padding-bottom:32px}.hero h1{font-size:clamp(44px,9vw,76px);letter-spacing:-2px}.hero .sub{max-width:490px;font-size:16px}.mapwrap{box-shadow:0 18px 65px #263a3020;border:6px solid white;border-radius:22px}#map{height:430px}.leaflet-container{background:#e6ece5}.leaflet-popup-content-wrapper{box-shadow:0 10px 30px #182c2433}.pin{background:#203f34;color:#fff;border:3px solid #fff;box-shadow:0 3px 12px #172e2866;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}.pin.food{background:#a86d47}.pin.bar{background:#715b84}.content{padding-top:28px}.filters{position:sticky;top:0;z-index:500;background:#f8f7f3;padding:12px 0 18px}.card{box-shadow:0 7px 25px #1d35230b;transition:transform .2s}.card:hover{transform:translateY(-3px)}.photoFrame{height:195px;position:relative;background:linear-gradient(135deg,#b4c2b6,#e7e7dc);overflow:hidden}.photoFrame img{height:100%;width:100%;object-fit:cover}.photoFrame .count{position:absolute;top:13px;left:13px;background:#ffffffec;color:#1d392e;padding:5px 9px;border-radius:20px;font-size:11px;font-weight:700}.card .body{padding:19px}.card h2{font-size:27px}.card p{color:#526158;min-height:65px}.btn{display:inline-flex;align-items:center;justify-content:center;font-weight:600}.sectionHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.sectionHead h2{font-size:31px}.mapCaption{max-width:900px;margin:9px auto 0;padding:0 8px;color:#77847a;font-size:12px}@media(max-width:650px){.hero{padding-top:24px}.hero h1{font-size:47px}.mapwrap{border:0;border-radius:0}#map{height:44vh;min-height:340px}.photoFrame{height:205px}.card p{min-height:0}.filters{margin:0 -17px;padding-left:17px}.sectionHead h2{font-size:28px}}</style></head><body><header><div class="brand">elsewhere.</div><a class="homeLink" href="/">← Все города</a></header><section class="hero"><h1>Saint Petersburg</h1><p class="sub">9 мест, которые стоит увидеть, попробовать и запомнить. Личный гид по городу.</p></section><section class="mapwrap"><div id="map" aria-label="Интерактивная карта Санкт-Петербурга"></div></section><main class="content"><div class="sectionHead"><h2>Избранные места</h2></div><div class="filters" id="filters"></div><div class="grid" id="cards"></div></main><footer>elsewhere. — Places worth sharing · Фотографии: Wikimedia Commons (если доступны) / ссылки на поиск изображений.</footer><script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script><script>
const places=[
{id:'stieglitz',name:'Музей Штиглица',type:'Посмотреть',lat:59.9449,lng:30.3365,desc:'Роскошные исторические залы и декоративно-прикладное искусство. Экскурсию лучше бронировать заранее.',search:'Музей прикладного искусства Академии Штиглица Санкт-Петербург',photo:'Stieglitz Museum Saint Petersburg'},
{id:'sevkabel',name:'Севкабель Порт',type:'Посмотреть',lat:59.9244,lng:30.2419,desc:'Набережная Финского залива, прогулки, кафе, выставки и красивые закаты.',search:'Севкабель Порт Санкт-Петербург',photo:'Sevkabel Port Saint Petersburg'},
{id:'savior',name:'Спас на Крови',type:'Посмотреть',lat:59.9401,lng:30.3286,desc:'Знаменитый храм с яркими куполами и впечатляющими мозаиками внутри.',search:'Спас на Крови Санкт-Петербург',photo:'Church of the Savior on Blood'},
{id:'isaac',name:'Исаакиевский собор',type:'Посмотреть',lat:59.9343,lng:30.3061,desc:'Монументальный собор и колоннада с панорамой центра Петербурга.',search:'Исаакиевский собор Санкт-Петербург',photo:'Saint Isaac Cathedral Saint Petersburg'},
{id:'russian',name:'Русский музей',type:'Посмотреть',lat:59.9388,lng:30.3321,desc:'Коллекция русского искусства: Брюллов, Репин, Айвазовский и другие.',search:'Русский музей Михайловский дворец Санкт-Петербург',photo:'State Russian Museum Saint Petersburg'},
{id:'annen',name:'Анненкирхе',type:'Посмотреть',lat:59.9458,lng:30.3546,desc:'Атмосферная лютеранская церковь с выставками и концертами. Уточните программу перед визитом.',search:'Анненкирхе Кирочная 8В Санкт-Петербург',photo:'Annenkirche Saint Petersburg',site:'https://www.annenkirche.com'},
{id:'duo',name:'DUO Asia',type:'Поесть',lat:59.9284,lng:30.3443,desc:'Современная азиатская кухня от команды DUO. Рекомендуется бронировать столик.',search:'DUO Asia ресторан Санкт-Петербург',photo:'Duo Asia Saint Petersburg restaurant'},
{id:'schastye',name:'Счастье',type:'Поесть',lat:59.9335,lng:30.3081,desc:'Уютное место у Исаакиевского собора для завтрака, кофе и десертов.',search:'Счастье Малая Морская 24 Санкт-Петербург',photo:'Schastye Saint Petersburg restaurant'},
{id:'orthodox',name:'Orthodox',type:'Бар',lat:59.9319,lng:30.3607,desc:'Коктейльный бар на Восстания, 4, вдохновлённый русской литературой, музыкой и живописью. В меню авторские истории по мотивам «Вишнёвого сада», «Щелкунчика» и «Белых ночей». Для вечера с подругами — особенно удачный вариант. Бронируйте заранее.',search:'Orthodox бар улица Восстания 4 Санкт-Петербург',photo:'Orthodox bar Saint Petersburg cocktails',site:'https://orthodox.bar/'}
];
const yandex=p=>'https://yandex.ru/maps/?text='+encodeURIComponent(p.search);
const photos=p=>'https://yandex.ru/images/search?text='+encodeURIComponent(p.photo);
const map=L.map('map',{scrollWheelZoom:false}).setView([59.936,30.313],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
const markers={};const bounds=[];
places.forEach(p=>{const m=L.marker([p.lat,p.lng],{icon:L.divIcon({className:'',html:'<div class="pin '+(p.type==='Поесть'?'food':p.type==='Бар'?'bar':'')+'">'+(places.indexOf(p)+1)+'</div>',iconSize:[34,34],iconAnchor:[17,17]})}).addTo(map);markers[p.id]=m;bounds.push([p.lat,p.lng]);m.bindPopup('<strong>'+p.name+'</strong><br>'+p.type+'<br><button onclick="showPlace(\\'+p.id+'\')">Открыть карточку ↗</button>')});map.fitBounds(bounds,{padding:[30,30]});
window.showPlace=id=>{setFilter('Все');setTimeout(()=>document.getElementById(id).scrollIntoView({behavior:'smooth',block:'start'}),80)};
let filter='Все';function setFilter(v){filter=v;render()}
function render(){
const filters=document.getElementById('filters');filters.innerHTML='';
['Все','Посмотреть','Поесть','Бар'].forEach(v=>{const btn=document.createElement('button');btn.textContent=v;btn.className=v===filter?'active':'';btn.addEventListener('click',()=>{filter=v;render()});filters.appendChild(btn)});
const cards=document.getElementById('cards');cards.innerHTML='';
places.filter(p=>filter==='Все'||p.type===filter).forEach(p=>{
const article=document.createElement('article');article.className='card';article.id=p.id;
const photo=document.createElement('div');photo.className='photoFrame';
const img=document.createElement('img');img.loading='lazy';img.alt=p.name;img.style.display='none';photo.appendChild(img);
const body=document.createElement('div');body.className='body';
const label=document.createElement('div');label.className='type';label.textContent=p.type;
const title=document.createElement('h2');title.textContent=p.name;
const desc=document.createElement('p');desc.textContent=p.desc;
const actions=document.createElement('div');actions.className='buttons';
function addLink(label,url,secondary){const link=document.createElement('a');link.textContent=label;link.href=url;link.target='_blank';link.rel='noopener';link.className='btn'+(secondary?' alt':'');actions.appendChild(link)}
addLink('Яндекс Карты ↗',yandex(p),false);addLink('Фотографии ↗',photos(p),true);if(p.site)addLink('Сайт ↗',p.site,true);
const locate=document.createElement('button');locate.textContent='На карте ↑';locate.className='btn alt';locate.style.border='0';locate.addEventListener('click',()=>focusPlace(p.id));actions.appendChild(locate);
body.append(label,title,desc,actions);article.append(photo,body);cards.appendChild(article);
loadPhoto(p,img);
});
}
async function loadPhoto(p,img){try{const u='https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(p.photo)+'&gsrlimit=1&prop=pageimages&pithumbsize=700&format=json&origin=*';const r=await fetch(u);const j=await r.json();const page=Object.values(j.query?.pages||{})[0];if(page?.thumbnail?.source){img.src=page.thumbnail.source;img.style.display='block'}}catch(e){}}
window.focusPlace=id=>{const p=places.find(x=>x.id===id);map.setView([p.lat,p.lng],15);markers[id].openPopup();document.getElementById('map').scrollIntoView({behavior:'smooth'})};render();
</script></body></html>
