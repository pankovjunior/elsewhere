<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f7f3"><title>Elsewhere — Saint Petersburg</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;background:#f8f7f3;color:#1e2925;font:15px/1.5 system-ui,-apple-system,sans-serif}header{padding:22px 20px 14px;max-width:900px;margin:auto}.brand{font-family:Georgia,serif;font-size:34px;letter-spacing:-2px;font-weight:bold}.tag{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#78827c}.hero{padding:14px 20px 20px;max-width:900px;margin:auto}h1{font-family:Georgia,serif;font-size:clamp(32px,8vw,58px);font-weight:normal;line-height:1.05;margin:10px 0}p{margin:6px 0 14px}.sub{color:#66716b}#map{height:360px;width:100%;z-index:1}.mapwrap{max-width:900px;margin:auto;overflow:hidden;border-radius:18px;border:1px solid #e4e5de}.content{max-width:900px;margin:auto;padding:20px}.filters{display:flex;gap:8px;overflow-x:auto;padding:3px 0 18px}.filters button{white-space:nowrap;border:1px solid #cfd5ce;border-radius:24px;padding:9px 16px;background:white;color:#1e2925;font:inherit}.filters button.active{background:#1d392e;color:white;border-color:#1d392e}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:15px}.card{background:#fff;border:1px solid #e4e6e0;border-radius:17px;overflow:hidden;scroll-margin-top:12px}.photo{height:170px;background:#e5e9e4;object-fit:cover;width:100%;display:block}.body{padding:17px}.type{font-size:11px;color:#738078;text-transform:uppercase;letter-spacing:1.2px}h2{font-family:Georgia,serif;font-weight:normal;font-size:25px;margin:5px 0}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.btn{background:#1d392e;color:white;text-decoration:none;padding:10px 13px;border-radius:10px;font-size:13px}.btn.alt{background:#eef1ec;color:#1d392e}.leaflet-popup-content-wrapper{border-radius:12px}.leaflet-popup-content{font:14px system-ui}.leaflet-popup-content button{border:0;background:#1d392e;color:white;padding:8px 12px;border-radius:8px;margin-top:8px}footer{padding:25px 20px;color:#7a837d;text-align:center;font-size:12px}@media(max-width:650px){#map{height:47vh;min-height:300px}.mapwrap{border-radius:0;border-left:0;border-right:0}.content{padding:17px}.grid{grid-template-columns:1fr}.photo{height:200px}}</style></head><body><header><div class="brand">elsewhere.</div><div class="tag">Somewhere worth going.</div></header><section class="hero"><div class="tag">Curated city guides / Russia</div><h1>Saint Petersburg</h1><p class="sub">9 мест, которые стоит увидеть, попробовать и запомнить. Личный гид по городу.</p></section><section class="mapwrap"><div id="map" aria-label="Интерактивная карта Санкт-Петербурга"></div></section><main class="content"><div class="filters" id="filters"></div><div class="grid" id="cards"></div></main><footer>elsewhere. — Places worth sharing · Фотографии: Wikimedia Commons (если доступны) / ссылки на поиск изображений.</footer><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const places=[
{id:'stieglitz',name:'Музей Штиглица',type:'Посмотреть',lat:59.9449,lng:30.3365,desc:'Роскошные исторические залы и декоративно-прикладное искусство. Экскурсию лучше бронировать заранее.',search:'Музей прикладного искусства Академии Штиглица Санкт-Петербург',photo:'Stieglitz Museum Saint Petersburg'},
{id:'sevkabel',name:'Севкабель Порт',type:'Посмотреть',lat:59.9244,lng:30.2419,desc:'Набережная Финского залива, прогулки, кафе, выставки и красивые закаты.',search:'Севкабель Порт Санкт-Петербург',photo:'Sevkabel Port Saint Petersburg'},
{id:'savior',name:'Спас на Крови',type:'Посмотреть',lat:59.9401,lng:30.3286,desc:'Знаменитый храм с яркими куполами и впечатляющими мозаиками внутри.',search:'Спас на Крови Санкт-Петербург',photo:'Church of the Savior on Blood'},
{id:'isaac',name:'Исаакиевский собор',type:'Посмотреть',lat:59.9343,lng:30.3061,desc:'Монументальный собор и колоннада с панорамой центра Петербурга.',search:'Исаакиевский собор Санкт-Петербург',photo:'Saint Isaac Cathedral Saint Petersburg'},
{id:'russian',name:'Русский музей',type:'Посмотреть',lat:59.9388,lng:30.3321,desc:'Коллекция русского искусства: Брюллов, Репин, Айвазовский и другие.',search:'Русский музей Михайловский дворец Санкт-Петербург',photo:'State Russian Museum Saint Petersburg'},
{id:'annen',name:'Анненкирхе',type:'Посмотреть',lat:59.9458,lng:30.3546,desc:'Атмосферная лютеранская церковь с выставками и концертами. Уточните программу перед визитом.',search:'Анненкирхе Кирочная 8В Санкт-Петербург',photo:'Annenkirche Saint Petersburg',site:'https://www.annenkirche.com'},
{id:'duo',name:'DUO Asia',type:'Поесть',lat:59.9284,lng:30.3443,desc:'Современная азиатская кухня от команды DUO. Рекомендуется бронировать столик.',search:'DUO Asia ресторан Санкт-Петербург',photo:'Duo Asia Saint Petersburg restaurant'},
{id:'schastye',name:'Счастье',type:'Поесть',lat:59.9335,lng:30.3081,desc:'Уютное место у Исаакиевского собора для завтрака, кофе и десертов.',search:'Счастье Малая Морская 24 Санкт-Петербург',photo:'Schastye Saint Petersburg restaurant'},
{id:'orthodox',name:'Orthodox',type:'Бар',lat:59.9319,lng:30.3607,desc:'Коктейльный бар на Восстания, 4, вдохновлённый русской литературой, музыкой и живописью. В меню авторские истории по мотивам «Вишнёвого сада», «Щелкунчика» и «Белых ночей». Для вечера с подругами — особенно удачный вариант. Бронируйте заранее.',search:'Orthodox бар улица Восстания 4 Санкт-Петербург',photo:'Orthodox bar Saint Petersburg cocktails',site:'https://orthodox.bar/'}
];
const yandex=p=>'https://yandex.ru/maps/?text='+encodeURIComponent(p.search);
const photos=p=>'https://yandex.ru/images/search?text='+encodeURIComponent(p.photo);
const map=L.map('map',{scrollWheelZoom:false}).setView([59.936,30.313],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
const markers={};const bounds=[];
places.forEach(p=>{const m=L.marker([p.lat,p.lng]).addTo(map);markers[p.id]=m;bounds.push([p.lat,p.lng]);m.bindPopup('<strong>'+p.name+'</strong><br>'+p.type+'<br><button onclick="showPlace(\''+p.id+'\')">Открыть карточку ↗</button>')});map.fitBounds(bounds,{padding:[30,30]});
window.showPlace=id=>{setFilter('Все');setTimeout(()=>document.getElementById(id).scrollIntoView({behavior:'smooth',block:'start'}),80)};
let filter='Все';function setFilter(v){filter=v;render()}
function render(){document.getElementById('filters').innerHTML=['Все','Посмотреть','Поесть','Бар'].map(v=>'<button class="'+(filter===v?'active':'')+'" onclick="setFilter(\''+v+'\')">'+v+'</button>').join('');document.getElementById('cards').innerHTML=places.filter(p=>filter==='Все'||p.type===filter).map(p=>'<article class="card" id="'+p.id+'"><div class="body"><div class="type">'+p.type+'</div><h2>'+p.name+'</h2><p>'+p.desc+'</p><div class="buttons"><a class="btn" target="_blank" rel="noopener" href="'+yandex(p)+'">Яндекс Карты ↗</a><a class="btn alt" target="_blank" rel="noopener" href="'+photos(p)+'">Фотографии ↗</a>'+(p.site?'<a class="btn alt" target="_blank" rel="noopener" href="'+p.site+'">Сайт ↗</a>':'')+'<button class="btn alt" style="border:0;cursor:pointer" onclick="focusPlace(\''+p.id+'\')">На карте ↑</button></div></div></article>').join('')}
window.focusPlace=id=>{const p=places.find(x=>x.id===id);map.setView([p.lat,p.lng],15);markers[id].openPopup();document.getElementById('map').scrollIntoView({behavior:'smooth'})};render();
</script></body></html>
